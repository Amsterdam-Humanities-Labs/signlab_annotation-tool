<!doctype html><meta charset=utf-8><title>HoReCo Segmented Videos</title>
<style>
 body{font:14px system-ui;background:#111;color:#eee;margin:16px}
 table{border-collapse:collapse;width:100%}th,td{padding:6px 10px;border-bottom:1px solid #333;text-align:left}
 th{cursor:pointer;background:#1b1b1b;position:sticky;top:0}
 a{color:#6cf}
 select{background:#222;color:#eee;border:1px solid #444;border-radius:4px;padding:4px}
 .klaar{color:#7fdca0;font-weight:600}
 .nietklaar{color:#888}
</style>
<h2>Segmented videos <small id=stat></small>
 <select id=cat style="font-size:13px;margin-left:8px"><option value="">All categories</option><option value=horeco>horeco</option><option value=health_holland>health_holland</option></select>
 <select id=stsel style="font-size:13px;margin-left:6px"><option value="">All statuses</option><option value=klaar>klaar</option><option value="niet klaar">niet klaar</option></select>
 <label style="margin-left:10px;font-size:13px;cursor:pointer"><input type=checkbox id=fsonly> finetune set</label>
 <small id=fscount style="margin-left:6px;color:#9cf"></small>
 <small id=stcount style="margin-left:8px;color:#aaa"></small>
</h2>
<table><thead><tr>
 <th data-k=video>video</th><th data-k=category>category</th><th data-k=_status>status</th><th data-k=n_segments>#segs</th>
 <th data-k=conf_min>conf min</th><th data-k=conf_max>conf max</th>
 <th data-k=conf_mean>conf mean</th><th data-k=novelty_count>novel</th><th>correct</th>
</tr></thead><tbody id=tb></tbody></table>
<script>
const ABS="https://signcollect.nl/annotation-tool/clusters/out/";
let rows=[],dir=1,key='conf_min',cat='',sts='',fset=new Set(),fsonly=false;
function color(v){const h=Math.round(v*120);return `background:hsl(${h},60%,20%)`;}
function draw(){
  let view=rows.slice();
  if(fsonly) view=view.filter(r=>fset.has(r.video));
  if(cat) view=view.filter(r=>r.category===cat);
  if(sts) view=view.filter(r=>r._status===sts);
  view.sort((a,b)=>(a[key]>b[key]?1:-1)*dir);
  document.getElementById('tb').innerHTML=view.map(r=>{
   const eaf=ABS+r.eaf;
   const tool=`tool/?video=${encodeURIComponent(r.video_url)}&eaf=${encodeURIComponent(eaf)}`;
   const cls=r._status==='klaar'?'klaar':'nietklaar';
   return `<tr><td>${r.video}</td><td>${r.category||''}</td><td class="${cls}">${r._status}</td><td>${r.n_segments}</td>
    <td style="${color(r.conf_min)}">${r.conf_min.toFixed(2)}</td>
    <td style="${color(r.conf_max)}">${r.conf_max.toFixed(2)}</td>
    <td style="${color(r.conf_mean)}">${r.conf_mean.toFixed(2)}</td>
    <td>${r.novelty_count}</td><td><a href="${tool}">open ▶</a></td></tr>`;
  }).join('');
  document.getElementById('stat').textContent=`(${view.length})`;
}
document.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{
  const k=th.dataset.k; dir=(k===key)?-dir:1; key=k; draw();});
document.getElementById('cat').addEventListener('change',e=>{cat=e.target.value;draw();});
document.getElementById('stsel').addEventListener('change',e=>{sts=e.target.value;draw();});
document.getElementById('fsonly').addEventListener('change',e=>{fsonly=e.target.checked;draw();});
Promise.all([
  fetch("out/videos.json").then(r=>r.json()),
  fetch("edit/io.php").then(r=>r.ok?r.json():{}).catch(()=>({})),
  fetch("out/finetune_set.json").then(r=>r.ok?r.json():[]).catch(()=>[])
]).then(([d,st,fs])=>{
  rows=d; fset=new Set(fs);
  let nk=0,k=0;
  rows.forEach(r=>{
    const e=st[r.video];
    r._status=(e&&e.status)?String(e.status).toLowerCase():'niet klaar';
    if(r._status==='klaar')k++;else nk++;
  });
  const fsDone=rows.filter(r=>fset.has(r.video)&&r._status==='klaar').length;
  document.getElementById('fscount').textContent=`(finetune set: ${fsDone}/${fset.size} klaar)`;
  document.getElementById('stcount').textContent=`klaar: ${k} · niet klaar: ${nk}`;
  draw();
});
</script>
