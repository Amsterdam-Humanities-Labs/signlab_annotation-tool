<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Moved to v3</title>
  <!-- webcam/ is now v3 with ?mode=webcam (#37). Keeps ?query and #hash. -->
  <meta http-equiv="refresh" content="0; url=../v3/?mode=webcam">
  <script>
    (function () {
      var q = location.search ? '&' + location.search.slice(1) : '';
      location.replace('../v3/?mode=webcam' + q + location.hash);
    })();
  </script>
</head>
<body><p>Moved to <a href="../v3/?mode=webcam">../v3/?mode=webcam</a>.</p></body>
</html>
